name: Build Relay release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    # RedfurSync.Core + tests target plain net10.0, so Linux runners work and are cheaper.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run relay tests
        run: dotnet test RedfurSync.Tests/RedfurSync.Tests.csproj -c Release

      - name: Verify the core library stays WinForms-free
        run: |
          if grep -rnE 'System\.Windows\.Forms|System\.Drawing' RedfurSync.Core --include='*.cs' --include='*.csproj'; then
            echo "::error::RedfurSync.Core must stay cross-platform so tests can run off Windows."
            exit 1
          fi

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ESOSyncClient.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $isRelease = $env:GITHUB_REF_TYPE -eq 'tag'
          if ($isRelease) {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<Version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH. Received: $env:GITHUB_REF_NAME"
            }
            if ($projectVersion -ne $Matches.Version) {
              throw "Tag version $($Matches.Version) does not match ESOSyncClient.csproj version $projectVersion."
            }
          }
          "RELEASE_VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$projectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_release=$($isRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Record build toolchain
        shell: pwsh
        run: |
          $sdkVersion = dotnet --version
          if ($sdkVersion -notmatch '^10\.0\.\d+$') {
            throw "Expected a .NET 10 SDK, found $sdkVersion."
          }
          "RELEASE_SDK=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Relay
        run: dotnet restore ESOSyncClient.csproj --runtime win-x64

      - name: Publish self-contained Relay
        run: >-
          dotnet publish ESOSyncClient.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release archive & ESO addon bundle
        shell: pwsh
        run: |
          Copy-Item publish/RedfurSync.exe RedfurSync.exe
          Compress-Archive -Path publish/RedfurSync.exe -DestinationPath RedfurSync-win-x64.zip

          $addonStage = New-Item -ItemType Directory -Path "addon-stage/FissalRelay" -Force
          Get-ChildItem -Path "AddOn/FissalRelay" -File | Where-Object { $_.Extension -in '.lua', '.txt', '.addon', '.xml' } | ForEach-Object {
            Copy-Item $_.FullName -Destination $addonStage.FullName
          }
          Compress-Archive -Path "addon-stage/FissalRelay" -DestinationPath "FissalRelay-v$($env:RELEASE_VERSION).zip"

      - name: Build release changelog
        shell: pwsh
        run: |
          $range = $null
          try {
            $previousTag = git describe --tags --abbrev=0 "HEAD^"
            if ($LASTEXITCODE -eq 0 -and $previousTag) { $range = "$previousTag..HEAD" }
          } catch {}
          $notes = if ($range) { git log --pretty=format:"- %s" $range } else { git log --pretty=format:"- %s" -n 15 }
          $changelog = (($notes | Out-String) -replace "`r`n", "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($changelog)) { $changelog = "Fissal Relay $($env:RELEASE_VERSION)" }
          if ($changelog.Length -gt 4000) { $changelog = $changelog.Substring(0, 4000) + "`n- (truncated)" }
          Set-Content -Path changelog.txt -Value $changelog -Encoding utf8

      - name: Sign update manifest (when RELAY_SIGNING_PRIVATE_KEY_B64 is configured)
        id: sign_manifest
        shell: pwsh
        env:
          RELAY_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RELAY_SIGNING_PRIVATE_KEY_B64 }}
          RELAY_SEQUENCE: ${{ vars.RELAY_RELEASE_SEQUENCE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELAY_SIGNING_PRIVATE_KEY_B64)) {
            Write-Host "RELAY_SIGNING_PRIVATE_KEY_B64 secret not set — skipping update-manifest.json signing (never emit unsigned manifests)."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $seqArg = if ([string]::IsNullOrWhiteSpace($env:RELAY_SEQUENCE)) { @("--sequence", "$(([int][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()))") } else { @("--sequence", $env:RELAY_SEQUENCE) }
          $releaseTag = "v$($env:RELEASE_VERSION)"
          $downloadUrl = "https://github.com/EchoTiger/ESOSyncClient/releases/download/$releaseTag/RedfurSync.exe"
          dotnet run --project tools/SignManifest/SignManifest.csproj --configuration Release -- `
            --exe RedfurSync.exe `
            --out-dir . `
            --version $env:RELEASE_VERSION `
            --download-url $downloadUrl `
            --changelog-file changelog.txt `
            @seqArg
          if ($LASTEXITCODE -ne 0) { throw "SignManifest failed with exit code $LASTEXITCODE" }
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $exe = Get-Item RedfurSync.exe
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          Expand-Archive RedfurSync-win-x64.zip -DestinationPath verify-zip
          $zipExe = Get-Item verify-zip/RedfurSync.exe
          $zipHash = (Get-FileHash $zipExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipExe.Length -ne $exe.Length -or $zipHash -ne $exeHash) {
            throw 'The zip does not contain the verified RedfurSync.exe.'
          }

          $addonZipName = "FissalRelay-v$($env:RELEASE_VERSION).zip"
          Expand-Archive $addonZipName -DestinationPath verify-addon
          if (Get-ChildItem verify-addon -Recurse -Include '*.exe','*.dll') {
            throw 'Addon archive must never contain binaries.'
          }
          if (-not (Test-Path "verify-addon/FissalRelay/FissalRelay.txt")) {
            throw 'Addon archive is missing FissalRelay/FissalRelay.txt.'
          }
          if (-not (Test-Path "verify-addon/FissalRelay/FissalRelay_Templates.xml") -or -not (Test-Path "verify-addon/FissalRelay/Bindings.xml")) {
            throw 'Addon archive is missing required XML files.'
          }

          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileVersion
          if (-not $fileVersion.StartsWith("$($env:RELEASE_VERSION).")) {
            throw "Executable file version $fileVersion does not match release $env:RELEASE_VERSION."
          }

          $zipHashValue = (Get-FileHash RedfurSync-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $addonHashValue = (Get-FileHash $addonZipName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumLines = @(
            "$exeHash  RedfurSync.exe"
            "$zipHashValue  RedfurSync-win-x64.zip"
            "$addonHashValue  $addonZipName"
          )

          if (Test-Path update-manifest.json) {
            if (-not (Test-Path update-manifest.sig)) {
              throw 'Unsigned update-manifest.json is forbidden.'
            }
            $sigItem = Get-Item update-manifest.sig
            if ($sigItem.Length -ne 64) {
              throw "update-manifest.sig must be 64 bytes, found $($sigItem.Length)."
            }
            $manifest = Get-Content update-manifest.json -Raw | ConvertFrom-Json
            if ($manifest.version -ne $env:RELEASE_VERSION) { throw 'Manifest version does not match release version.' }
            if ([int64]$manifest.sizeBytes -ne $exe.Length) { throw 'Manifest size does not match RedfurSync.exe.' }
            if ($manifest.sha256 -ne $exeHash) { throw 'Manifest SHA-256 does not match RedfurSync.exe.' }
            $manifestHash = (Get-FileHash update-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
            $sigHash = (Get-FileHash update-manifest.sig -Algorithm SHA256).Hash.ToLowerInvariant()
            $sumLines += "$manifestHash  update-manifest.json"
            $sumLines += "$sigHash  update-manifest.sig"
          }

          $sumLines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RedfurSync-${{ steps.version.outputs.version }}-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            RedfurSync.exe
            RedfurSync-win-x64.zip
            FissalRelay-v${{ steps.version.outputs.version }}.zip
            update-manifest.json
            update-manifest.sig
            SHA256SUMS.txt

      - name: Create draft GitHub release (signed manifests required for auto-updater)
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            RedfurSync.exe
            RedfurSync-win-x64.zip
            FissalRelay-v${{ steps.version.outputs.version }}.zip
            update-manifest.json
            update-manifest.sig
            SHA256SUMS.txt

      - name: Publish verified GitHub release
        if: steps.version.outputs.is_release == 'true' && steps.sign_manifest.outputs.signed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest